services:
  mysql:
    image: mysql:8.4
    container_name: trade-platform-mysql
    restart: unless-stopped

    ports:
      - "${DB_PORT}:3306"

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: trade-platform-redis
    restart: unless-stopped

    ports:
      - "${REDIS_PORT:-6379}:6379"

    command:
      - redis-server
      - --appendonly
      - "no"
      - --save
      - ""

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  mysql-data:
